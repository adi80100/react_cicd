name : Deploy react project

on :
    push :
        branches :
              - main

jobs :
    build-deploy  :
            runs-on : ubuntu-latest

            steps :
                  #checkout the repo
                  - name : Checkout code
                    uses : actions/checkout@v3

                  #checkout the repo
                  - name : Setup Node
                    uses : actions/setup-node@v3
                    with :
                          node-version: 18

                  #indtall depene
                  - name : Install dependencies
                    run : npm install 

                  #build the projct

                  - name : build applicaiton
                    run : npm run build 

                  # deploay the pages
                  - name : Deploy to Github pages
                    uses: peaceiris/actions-gh-pages@v4
                    with : 
                        github_token : ${{secrets.GITHUB_TOKEN}}
                        publish_dir : dist
                